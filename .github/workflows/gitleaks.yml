name: Secret scan (gitleaks)

on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * 1" # toda segunda 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (segredos vazados)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historico completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repositorio pessoal/publico nao exige GITLEAKS_LICENSE; se virar organizacao,
          # adicionar o secret GITLEAKS_LICENSE.
