name: MSIX (Microsoft Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    name: Build MSIX (x64, unsigned)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Build MSIX
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msix.ps1

      - name: Upload MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msix
          path: dist/*.msix
          if-no-files-found: error
