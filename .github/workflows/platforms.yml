name: Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-deb:
    name: Linux .deb (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            cmake meson ninja-build nasm pkg-config \
            curl wget file libssl-dev

      - name: Install frontend tooling
        run: npm ci

      - name: Test native AVIF decoder (libavif/dav1d)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build .deb
        run: npx tauri build --bundles deb --config src-tauri/tauri.linux.conf.json

      - name: Normalize .deb package name
        run: bash scripts/fix-deb-package-name.sh

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  linux-runtime:
    name: Linux runtime smoke test (Xvfb + .deb)
    runs-on: ubuntu-22.04
    needs: linux-deb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download .deb artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-deb
          path: dist

      - name: Install system dependencies + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Prepare Desktop for postinst check
        run: mkdir -p "$HOME/Desktop"

      - name: Install the .deb package
        run: |
          sudo apt-get install -y ./dist/*.deb
          dpkg -L avifnim-viewer | head -20 || true

      - name: Verify desktop shortcut (postinst)
        run: |
          set -e
          test -f "$HOME/Desktop/avifnim-viewer.desktop"
          grep -q '^Exec=avifnim-viewer' "$HOME/Desktop/avifnim-viewer.desktop"
          echo "OK: atalho criado automaticamente pelo postinst"

      - name: Verify MIME types (Open With)
        run: |
          set -e
          desktop=/usr/share/applications/avifnim-viewer.desktop
          grep -q 'MimeType=.*image/avif' "$desktop"
          grep -q 'MimeType=.*image/webp' "$desktop"
          grep -q 'MimeType=.*image/gif' "$desktop"
          grep -q 'MimeType=.*image/x-portable-pixmap' "$desktop"
          echo "OK: MimeType registrado para Abrir com"

      - name: Run app headless with an animated image
        run: |
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          set +e
          timeout 15 xvfb-run -a avifnim-viewer tests/assets/anim.gif > runtime.log 2>&1
          code=$?
          set -e
          echo "exit code: $code"
          cat runtime.log | tail -40
          if [ "$code" -ne 124 ]; then
            echo "App encerrou antes do timeout (code=$code) — esperado 124 (rodando)."
            exit 1
          fi
          echo "OK: app rodou 15s sem crash no Linux."

  macos-dmg:
    name: macOS universal .dmg (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain (Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Build universal .dmg
        run: npx tauri build --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.macos.conf.json

      - name: Verify document types (Info.plist)
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target -path '*bundle/dmg/*.dmg' | head -n1)"
          test -n "$dmg"
          mount=/tmp/avifnim-verify
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          plist="$mount/AVIFnim Viewer.app/Contents/Info.plist"
          test -f "$plist"
          echo "--- volume ---"
          ls -la "$mount"
          echo "--- background ---"
          find "$mount" -maxdepth 4 -iname '*background*' -print || true
          echo "--- document types ---"
          plutil -p "$plist" | grep -Ei 'CFBundleDocumentTypes|avif' || true
          plutil -p "$plist" | grep -q 'CFBundleDocumentTypes'
          plutil -p "$plist" | grep -qi 'avif'
          test -n "$(find "$mount" -maxdepth 4 -iname '*background*.png' | head -n1)"
          echo "OK: CFBundleDocumentTypes com AVIF e background no dmg"

      - name: Upload .dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
