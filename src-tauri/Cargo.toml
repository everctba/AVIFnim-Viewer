[package]
name = "avifnim-viewer"
version = "0.1.2"
description = "Visualizador gratuito e open source de AVIF, WebP, GIF animados e PPM/PNM"
authors = ["Everson Mayer <mayerdesigner@gmail.com>"]
license = "MIT"
repository = "https://github.com/everctba/AVIFnim-Viewer"
edition = "2021"
rust-version = "1.88"

[lib]
name = "avifnim_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
rfd = "0.15"
open = "5"

[target.'cfg(windows)'.dependencies]
avif-rust = "0.3"
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
avif-rust = "0.3"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# libavif + dav1d (CPU) compilados estaticamente apenas no Linux.
libavif-sys = { version = "0.18", default-features = false, features = ["codec-dav1d"] }

[dev-dependencies]
proptest = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
