[package]
name = "avifnim-viewer"
version = "0.1.2"
description = "Visualizador gratuito e open source de AVIF, WebP, GIF animados e PPM/PNM"
authors = ["Everson Mayer <mayerdesigner@gmail.com>"]
license = "MIT"
repository = "https://github.com/everctba/AVIFnim-Viewer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "avifnim_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
rfd = "0.15"
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
