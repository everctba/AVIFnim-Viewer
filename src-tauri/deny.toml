# cargo-deny — supply chain (advisories + licencas)
# https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"
ignore = [
  # Dependencias transitivas do stack GTK/zbus do Tauri no Linux (sem upgrade seguro
  # disponivel nesta versao). Vulnerabilidades continuam bloqueando o CI.
  "RUSTSEC-2024-0370", # proc-macro-error (gtk-rs 0.18)
  "RUSTSEC-2026-0370", # zvariant_derive (rfd/ashpd/zbus)
  "RUSTSEC-2026-0371", # zbus_names (rfd/ashpd/zbus)
  "RUSTSEC-2026-0372", # zvariant (rfd/ashpd/zbus)
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
